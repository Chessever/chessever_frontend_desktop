<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The browser build is served from the root of app.chessever.com; the
    placeholder below is replaced by `flutter build --base-href`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ChessEver in your browser: live broadcasts, games, players and the opening explorer.">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ChessEver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ChessEver</title>
  <link rel="manifest" href="manifest.json">

  <script id="chessever-web-analytics">
    // Browser-only, coarse page-load measurement. Never bridge the native
    // AnalyticsService: its account/chess metadata must not enter this stream.
    (function () {
      var id = 'G-06TRX0SNEF';
      if (window.__chesseverWebAnalyticsStarted ||
          location.origin !== 'https://app.chessever.com' ||
          // Do not load third-party analytics on OAuth callbacks or any URL
          // carrying query/fragment data. Leave the URL intact for auth.
          location.search || location.hash ||
          navigator.globalPrivacyControl === true ||
          navigator.doNotTrack === '1' || window.doNotTrack === '1' ||
          window['ga-disable-' + id] === true) return;
      window.__chesseverWebAnalyticsStarted = true;
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      // No new consent UI or inferred analytics consent. Keep the existing
      // site's basic analytics behavior, but never enable advertising consent.
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      var page = {
        page_location: 'https://app.chessever.com/',
        page_referrer: '',
        page_title: 'ChessEver Web App'
      };
      gtag('set', Object.assign({}, page, {
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
        ads_data_redaction: true,
        url_passthrough: false,
        ignore_referrer: true,
        campaign_id: '', campaign_source: '', campaign_medium: '',
        campaign_name: '', campaign_term: '', campaign_content: ''
      }));
      gtag('js', new Date());
      gtag('config', id, Object.assign({}, page, {
        send_page_view: false,
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
        // Host-only cookie: do not mix website and browser-app visitors.
        cookie_domain: 'app.chessever.com',
        cookie_prefix: 'ce_web',
        cookie_flags: 'SameSite=Lax;Secure'
      }));
      gtag('event', 'page_view', Object.assign({ send_to: id }, page));
      var script = document.createElement('script');
      script.async = true;
      // Prevent the script request's Referer header leaking an arrival path.
      script.referrerPolicy = 'no-referrer';
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
      document.head.appendChild(script);
    })();
  </script>

  <style>
    html, body { margin: 0; height: 100%; background: #0c0c0e; }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #8a8a90; letter-spacing: 0.01em;
    }
    /* flutter_bootstrap.js: unsupported browser or failed load. */
    #boot.message > div { max-width: 420px; padding: 0 24px; }
    #boot.message h1 {
      margin: 0 0 12px; font-size: 22px; font-weight: 600; line-height: 1.3;
      color: #f2f2f2; letter-spacing: 0;
    }
    #boot.message p { margin: 0; color: #a6a6a6; line-height: 1.5; }
    #boot.message a { color: #f2f2f2; }
  </style>

  <!--
    The engine downloads every font in FontManifest.json before the first
    frame, but only after main.dart.wasm has downloaded and compiled.
    scripts/build_web.sh replaces the marker below with a preload per font so
    they download alongside the Wasm instead of after it.
  -->
  <!-- flutter-font-preloads -->

  <script>
    // Flutter turns the browser's menu off on its own view once the app
    // boots (web_boot.dart); this covers the page around it and the loading
    // screen, so right-click never opens the browser menu.
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });
  </script>

  <script>
    // Some image hosts send no CORS headers, which Flutter's web renderer
    // needs to decode an image. Route them through the same-origin relay in
    // web_worker/index.js (keep the two host lists in sync).
    (function () {
      var relayHosts = {
        "image.lichess.org": true,
        "image.lichess1.org": true,
        "chessever.com": true,
        "www.chessever.com": true,
        "marketing.chess.com": true,
        "saintlouischessclub.org": true,
        "aicf.in": true,
        "ruchess.ru": true,
        "www.pucharpolskiamatorow.pl": true
      };
      // Shared hosts where only one bucket is relayed.
      var relayPrefixes = [
        { host: "storage.googleapis.com", path: "/cdn.chessmanager.com/" }
      ];
      // image.lichess1.org 301s every request to image.lichess.org.
      var hostAliases = { "image.lichess1.org": "image.lichess.org" };
      function relayed(raw) {
        try {
          var url = new URL(raw, location.href);
          var allowed = relayHosts[url.hostname] ||
            relayPrefixes.some(function (p) {
              return url.hostname === p.host && url.pathname.indexOf(p.path) === 0;
            });
          if (allowed) {
            if (hostAliases[url.hostname]) url.hostname = hostAliases[url.hostname];
            return "/_img?u=" + encodeURIComponent(url.href);
          }
        } catch (e) {}
        return null;
      }
      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var raw = typeof input === "string" ? input
          : input instanceof URL ? input.href
          : input && input.url;
        var target = raw && relayed(raw);
        return nativeFetch(target || input, init);
      };
      var nativeOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        var target = relayed(String(url));
        if (target) arguments[1] = target;
        return nativeOpen.apply(this, arguments);
      };
    })();
  </script>
</head>
<body>
  <div id="boot">Loading ChessEver…</div>
  <!-- Inlined at build time: saves the round trip for flutter_bootstrap.js. -->
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
